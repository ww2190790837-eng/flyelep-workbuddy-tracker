<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>背景风格候选 · Fleta</title>
<style>
  body{margin:0;background:#07080a;color:#dfe7ee;font-family:"JetBrains Mono",monospace}
  h2{font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin:0;padding:10px 14px;color:#7dd3fc}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
  .cell{position:relative;height:300px;border:1px solid rgba(255,255,255,.12);overflow:hidden}
  .cell>div{position:absolute;inset:0}
  .lbl{position:absolute;left:10px;bottom:8px;z-index:5;font-size:11px;letter-spacing:.18em;color:#8fc4ec}
</style>
</head>
<body>
<p style="padding:16px 14px 0;margin:0;font-size:12px;letter-spacing:.1em;color:#8fc4ec;line-height:1.9">
  背景风格候选（均为开源库 Vanta.js 渲染，非手绘）<br>
  当前线上用的是 <b style="color:#fff">01 NET</b>。喜欢别的风格，把编号告诉我即可一键切换。
</p>
<div class="grid">
  <div class="cell"><div id="c1"></div><span class="lbl">01 NET</span></div>
  <div class="cell"><div id="c2"></div><span class="lbl">02 HALO</span></div>
  <div class="cell"><div id="c3"></div><span class="lbl">03 RINGS</span></div>
  <div class="cell"><div id="c4"></div><span class="lbl">04 TOPOLOGY</span></div>
  <div class="cell"><div id="c5"></div><span class="lbl">05 FOG</span></div>
  <div class="cell"><div id="c6"></div><span class="lbl">06 DOTS</span></div>
</div>

<script src="/vendor/three.min.js"></script>
<script src="/vendor/vanta/vanta.net.min.js"></script>
<script src="/vendor/vanta/vanta.halo.min.js"></script>
<script src="/vendor/vanta/vanta.rings.min.js"></script>
<script src="/vendor/vanta/vanta.topology.min.js"></script>
<script src="/vendor/vanta/vanta.fog.min.js"></script>
<script src="/vendor/vanta/vanta.dots.min.js"></script>
<script>
var BG = 0x07080a, SKY = 0x38bdf8, SKY2 = 0x0ea5e9, STEEL = 0x2f6f96;
var base = { mouseControls:false, touchControls:false, gyroControls:false, minHeight:200, minWidth:200, scale:1, scaleMobile:1 };

function up(o){ if(o) o.resize(); }

if (window.VANTA && VANTA.NET) up(VANTA.NET(Object.assign({el:'#c1', backgroundColor:BG, color:SKY, points:9.0, maxDistance:24.0, spacing:19.0, showDots:true}, base)));
if (window.VANTA && VANTA.HALO) up(VANTA.HALO(Object.assign({el:'#c2', backgroundColor:BG, color:SKY, color2:SKY2, size:1.7, xOffset:0.1, yOffset:-0.05}, base)));
if (window.VANTA && VANTA.RINGS) up(VANTA.RINGS(Object.assign({el:'#c3', backgroundColor:BG, color:SKY, backgroundAlpha:1}, base)));
if (window.VANTA && VANTA.TOPOLOGY) up(VANTA.TOPOLOGY(Object.assign({el:'#c4', backgroundColor:BG, color:STEEL}, base)));
if (window.VANTA && VANTA.FOG) up(VANTA.FOG(Object.assign({el:'#c5', baseColor:BG, lowlightColor:0x0b2436, midtoneColor:0x0e4c72, highlightColor:0x38bdf8, blurFactor:0.62, speed:1.4, zoom:1.1}, base)));
if (window.VANTA && VANTA.DOTS) up(VANTA.DOTS(Object.assign({el:'#c6', backgroundColor:BG, color:SKY, color2:SKY2, size:3.2, spacing:26, showLines:true}, base)));
</script>
</body>
</html>

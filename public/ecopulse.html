<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080b14" />
<title>电商脉搏 · 全球电商平台政策 / 活动 / 每日热点</title>
<meta name="description" content="电商脉搏：手机国内外各大电商平台的政策调整、活动计划与每日热点事件，大图轮播，一键跳转原文。" />
<meta property="og:title" content="电商脉搏 · 全球电商政策与活动情报台" />
<meta property="og:description" content="淘宝、京东、抖音、拼多多、亚马逊、TikTok Shop、Shopee、Temu 政策与活动一屏掌握" />
<meta property="og:type" content="website" />
<link rel="icon" href="/logo.svg" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080b14;--surface:#111524;
    --text:#eef1f8;--text-2:#aab0c4;--text-3:#7c8299;
    --primary:#7c5cff;--primary-2:#9b7cff;--pink:#ff5b9b;--cyan:#00d4ff;--amber:#ffb020;
    --gradient:linear-gradient(135deg,#7c5cff 0%,#9b7cff 45%,#ff5b9b 100%);
    --card-bg:rgba(13,16,30,.62);
    --border:rgba(255,255,255,.12);
  }
  html{background:var(--bg);scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ============ 顶部导航 ============ */
  .top-nav{
    position:fixed;top:0;left:0;right:0;z-index:60;
    backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    background:rgba(8,11,20,.55);border-bottom:1px solid rgba(255,255,255,.07);
  }
  .nav-inner{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
  .nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.2px}
  .nav-logo img{width:32px;height:32px;border-radius:9px;box-shadow:0 4px 16px rgba(124,92,255,.4)}
  .nav-logo .pulse{
    width:8px;height:8px;border-radius:50%;background:var(--pink);margin-left:2px;
    box-shadow:0 0 0 0 rgba(255,91,155,.7);animation:pulse 2s infinite;
  }
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,91,155,0)}100%{box-shadow:0 0 0 0 rgba(255,91,155,0)}}
  .nav-sub{font-size:12px;color:var(--text-3);font-weight:500;letter-spacing:.4px}
  .nav-spacer{flex:1}
  .nav-back{
    padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;
    border:1px solid rgba(124,92,255,.35);background:rgba(124,92,255,.10);color:var(--primary-2);
    transition:.25s;white-space:nowrap;
  }
  .nav-back:hover{background:rgba(124,92,255,.2);transform:translateY(-1px)}

  /* ============ 轮播舞台 ============ */
  .stage{
    position:relative;height:100vh;height:100svh;min-height:560px;
    overflow:hidden;isolation:isolate;
  }
  .stage-media{position:absolute;inset:0;cursor:pointer;overflow:hidden}
  /* 模糊铺底：解决不同比例图片的黑边问题 */
  .stage-bg{
    position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
    filter:blur(52px) saturate(1.5) brightness(.62);transform:scale(1.1);
    transition:opacity .8s ease;opacity:.95;
  }
  /* 主图：Ken Burns 缓慢缩放平移，让静态新闻图“动”起来 */
  .stage-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform-origin:52% 46%;will-change:transform;
  }
  .stage-img.kb{animation:kenburns 9.5s cubic-bezier(.16,.7,.24,1) both}
  @keyframes kenburns{
    from{transform:scale(1.03) translate3d(0,0,0)}
    to{transform:scale(1.16) translate3d(-2%,-1.4%,0)}
  }
  .stage-veil{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top,rgba(6,8,16,.96) 0%,rgba(6,8,16,.72) 22%,rgba(6,8,16,.10) 52%,rgba(6,8,16,.34) 100%),
      linear-gradient(to right,rgba(6,8,16,.86) 0%,rgba(6,8,16,.28) 46%,transparent 72%),
      radial-gradient(ellipse 90% 70% at 50% 40%,transparent 40%,rgba(6,8,16,.55) 100%);
  }
  .stage-grain{
    position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* 一道扫光，增强“动图”质感 */
  .stage-scan{
    position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.5;
  }
  .stage-scan::after{
    content:"";position:absolute;top:-40%;left:-60%;width:38%;height:180%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
    transform:rotate(14deg);animation:sweep 7.5s ease-in-out infinite;
  }
  @keyframes sweep{0%{left:-60%}55%{left:130%}100%{left:130%}}

  /* 顶部：分类筛选 */
  .stage-top{
    position:absolute;top:66px;left:0;right:0;z-index:12;
    display:flex;align-items:center;gap:12px;padding:0 24px;flex-wrap:wrap;
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;
    border:1px solid rgba(255,255,255,.16);background:rgba(12,16,30,.5);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(255,255,255,.72);transition:.25s;white-space:nowrap;
  }
  .chip:hover{color:#fff;border-color:rgba(255,255,255,.34);transform:translateY(-1px)}
  .chip.on{
    color:#fff;border-color:transparent;background:var(--gradient);
    box-shadow:0 6px 20px rgba(124,92,255,.4);
  }
  .counter{
    margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:13px;color:rgba(255,255,255,.6);
    background:rgba(12,16,30,.5);border:1px solid rgba(255,255,255,.12);
    padding:6px 12px;border-radius:999px;backdrop-filter:blur(12px);
  }
  .counter b{color:#fff;font-size:15px}

  /* 左右箭头 */
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:14;
    width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    background:rgba(12,16,30,.5);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;font-size:22px;line-height:1;transition:.25s;
  }
  .arrow:hover{background:rgba(124,92,255,.5);border-color:rgba(124,92,255,.7);transform:translateY(-50%) scale(1.08)}
  .arrow.prev{left:20px}
  .arrow.next{right:20px}

  /* 左下角信息卡（时间 / 内容 / 日期） */
  .info-card{
    position:absolute;left:28px;bottom:180px;z-index:13;
    width:min(620px,calc(100% - 56px));
    padding:24px 26px 22px;border-radius:20px;
    background:var(--card-bg);border:1px solid var(--border);
    backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .card-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;
    font-size:12px;font-weight:700;letter-spacing:.2px;
    background:var(--gradient);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.35);
  }
  .badge.g{background:linear-gradient(135deg,#00b8d4,#00d4ff);box-shadow:0 4px 14px rgba(0,212,255,.3)}
  .cat{font-size:12px;font-weight:600;color:var(--text-2);padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
  .sep{width:4px;height:4px;border-radius:50%;background:var(--text-3)}
  .src{font-size:12px;color:var(--text-3)}

  .datetime{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .dt-date{font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px}
  .dt-time{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;color:var(--amber);letter-spacing:.5px}
  .dt-week{font-size:12px;color:var(--text-2)}
  .dt-ago{font-size:12px;color:var(--text-3);padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.06)}

  .card-title{
    font-size:clamp(20px,2.4vw,30px);font-weight:800;line-height:1.28;letter-spacing:-.4px;
    margin-bottom:10px;color:#fff;
    text-shadow:0 2px 20px rgba(0,0,0,.5);
  }
  .card-summary{
    font-size:14.5px;line-height:1.75;color:rgba(255,255,255,.82);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .tag{
    font-size:11.5px;padding:4px 10px;border-radius:6px;color:var(--primary-2);
    background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.28);
  }
  .card-cta{
    display:inline-flex;align-items:center;gap:8px;margin-top:18px;
    padding:11px 20px;border-radius:12px;font-size:14px;font-weight:700;
    background:var(--gradient);color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.4);
    transition:.28s cubic-bezier(.22,1,.36,1);
  }
  .card-cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(124,92,255,.55)}
  .card-cta svg{width:16px;height:16px;transition:transform .28s}
  .card-cta:hover svg{transform:translateX(4px)}

  /* 入场动画 */
  .anim-in .card-row,.anim-in .datetime,.anim-in .card-title,.anim-in .card-summary,.anim-in .card-tags,.anim-in .card-cta{
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }
  .anim-in .card-row{animation-delay:.04s}
  .anim-in .datetime{animation-delay:.1s}
  .anim-in .card-title{animation-delay:.16s}
  .anim-in .card-summary{animation-delay:.22s}
  .anim-in .card-tags{animation-delay:.28s}
  .anim-in .card-cta{animation-delay:.34s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* 底部：进度 + 缩略图 */
  .stage-bottom{position:absolute;left:0;right:0;bottom:0;z-index:13;padding:0 24px 18px}
  .progress{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:14px}
  .progress i{display:block;height:100%;width:0;background:var(--gradient);box-shadow:0 0 14px rgba(124,92,255,.6)}
  .progress i.run{animation:fill linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}
  .thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .thumbs::-webkit-scrollbar{height:5px}
  .thumbs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .thumb{
    position:relative;flex:none;width:118px;height:66px;border-radius:10px;overflow:hidden;
    border:1.5px solid rgba(255,255,255,.14);opacity:.55;transition:.25s;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb span{
    position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10.5px;font-weight:600;
    background:linear-gradient(to top,rgba(0,0,0,.9),transparent);color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .thumb:hover{opacity:.9;transform:translateY(-2px)}
  .thumb.on{opacity:1;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(124,92,255,.22),0 8px 20px rgba(0,0,0,.4)}
  .thumb-ctrls{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .play-btn{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:rgba(12,16,30,.6);border:1px solid rgba(255,255,255,.16);color:#fff;transition:.25s;
  }
  .play-btn:hover{background:rgba(124,92,255,.4)}
  .play-btn svg{width:14px;height:14px}
  .hint{font-size:11.5px;color:var(--text-3);letter-spacing:.2px}

  /* ============ 下方面板 ============ */
  .board{max-width:1440px;margin:0 auto;padding:56px 24px 72px;display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
  .panel{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px 22px 18px}
  .panel h2{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px}
  .panel h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gradient)}
  .hot-list{list-style:none;display:flex;flex-direction:column}
  .hot-item{
    display:flex;gap:14px;align-items:flex-start;padding:12px 10px;border-radius:12px;
    cursor:pointer;transition:.22s;border:1px solid transparent;
  }
  .hot-item:hover{background:rgba(124,92,255,.09);border-color:rgba(124,92,255,.22);transform:translateX(3px)}
  .hot-time{
    font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--text-3);
    padding-top:3px;flex:none;width:96px;
  }
  .hot-main{flex:1;min-width:0}
  .hot-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.5}
  .hot-meta{font-size:11.5px;color:var(--text-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .hot-dot{width:6px;height:6px;border-radius:50%;background:var(--pink);margin-top:8px;flex:none}

  .cd-list{display:flex;flex-direction:column;gap:12px}
  .cd{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
  .cd-days{
    font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;color:#fff;
    min-width:62px;text-align:center;line-height:1.1;
  }
  .cd-days small{display:block;font-size:10px;color:var(--text-3);font-weight:500;letter-spacing:1px}
  .cd-name{font-size:14px;font-weight:600}
  .cd-date{font-size:12px;color:var(--text-3);margin-top:2px;font-family:"JetBrains Mono",monospace}
  .cd-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .cd-bar i{display:block;height:100%;background:var(--gradient);border-radius:3px}

  footer{padding:0 24px 40px;text-align:center;color:var(--text-3);font-size:12px;line-height:1.8}

  @media (max-width:1000px){
    .board{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .nav-sub{display:none}
    .stage-top{top:58px;padding:0 14px}
    .counter{margin-left:0}
    .info-card{left:14px;right:14px;width:auto;bottom:148px;padding:18px 18px 16px;border-radius:16px}
    .card-summary{-webkit-line-clamp:2;font-size:13.5px}
    .dt-time{font-size:19px}
    .arrow{width:40px;height:40px;font-size:18px}
    .arrow.prev{left:10px}
    .arrow.next{right:10px}
    .stage-bottom{padding:0 14px 14px}
    .thumb{width:96px;height:54px}
    .hot-time{width:auto}
    .hot-item{flex-wrap:wrap;gap:8px}
  }
  @media (prefers-reduced-motion:reduce){
    .stage-img.kb,.stage-scan::after,.nav-logo .pulse{animation:none}
    .anim-in *{animation:none!important}
  }
</style>
</head>
<body>

<header class="top-nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <img src="/logo.svg" alt="logo" />
      电商脉搏<span class="pulse"></span>
    </a>
    <span class="nav-sub">全球电商平台政策 · 活动 · 每日热点</span>
    <span class="nav-spacer"></span>
    <a class="nav-back" href="/">← 返回首页</a>
  </div>
</header>

<main>
  <section class="stage" id="stage" aria-label="电商资讯大图轮播">
    <div class="stage-media" id="stageMedia" title="点击打开原文">
      <img class="stage-bg" id="stageBg" alt="" aria-hidden="true" />
      <img class="stage-img" id="stageImg" alt="" />
      <div class="stage-veil"></div>
      <div class="stage-scan"></div>
      <div class="stage-grain"></div>
    </div>

    <div class="stage-top">
      <div class="filters" id="filters"></div>
      <div class="counter"><b id="idxNow">1</b> / <span id="idxAll">1</span></div>
    </div>

    <button class="arrow prev" id="prevBtn" aria-label="上一条">‹</button>
    <button class="arrow next" id="nextBtn" aria-label="下一条">›</button>

    <article class="info-card" id="infoCard">
      <div class="card-row">
        <span class="badge" id="cPlatform">—</span>
        <span class="sep"></span>
        <span class="cat" id="cCategory">—</span>
        <span class="sep"></span>
        <span class="src" id="cSource">—</span>
      </div>
      <div class="datetime">
        <span class="dt-date" id="cDate">—</span>
        <span class="dt-time" id="cTime">—</span>
        <span class="dt-week" id="cWeek"></span>
        <span class="dt-ago" id="cAgo"></span>
      </div>
      <h1 class="card-title" id="cTitle">—</h1>
      <p class="card-summary" id="cSummary"></p>
      <div class="card-tags" id="cTags"></div>
      <a class="card-cta" id="cLink" href="#" target="_blank" rel="noopener noreferrer">
        阅读原文
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </article>

    <div class="stage-bottom">
      <div class="progress"><i id="prog"></i></div>
      <div class="thumb-ctrls">
        <button class="play-btn" id="playBtn" aria-label="暂停/播放">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <span class="hint">点击大图跳转原文 · ← → 切换 · 空格暂停</span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>

  <section class="board">
    <div class="panel">
      <h2>今日热点速览</h2>
      <ul class="hot-list" id="hotList"></ul>
    </div>
    <div class="panel">
      <h2>大促倒计时</h2>
      <div class="cd-list" id="cdList"></div>
    </div>
  </section>

  <footer>
    数据来源：电商派 · 雨果跨境 · 一页派 · 卖家之家 · 路由派 · 淘宝江湖 · 易企微，图片均为对应新闻页配图<br />
    点击任意大图或「阅读原文」可跳转至新闻源页面核对细节
  </footer>
</main>

<script src="/ecopulse-data.js"></script>
<script>
(function () {
  var EVENTS = window.ECO_EVENTS || [];
  var FILTERS = window.ECO_FILTERS || [];
  var CD = window.ECO_COUNTDOWNS || [];
  var AUTOPLAY = 7000;

  var CAT_LABEL = { hot: "每日热点", policy: "平台政策", overseas: "海外跨境", campaign: "活动计划" };

  var el = function (id) { return document.getElementById(id); };
  var stage = el("stage"), media = el("stageMedia"), bg = el("stageBg"), img = el("stageImg");
  var card = el("infoCard"), prog = el("prog"), thumbsBox = el("thumbs");
  var playIcon = el("playIcon");

  var list = EVENTS.slice();
  var filterKey = "all";
  var idx = 0;
  var playing = true;
  var timer = null;

  /* ---------- 工具 ---------- */
  function weekday(dstr) {
    var w = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    return w[new Date(dstr + "T00:00:00").getDay()];
  }
  function ago(dstr, tstr) {
    var then = new Date((dstr + "T" + (tstr || "00:00") + ":00").replace(/-/g, "/")).getTime();
    var diff = Date.now() - then;
    if (isNaN(diff)) return "";
    var day = Math.floor(diff / 86400000);
    if (day <= 0) { var h = Math.floor(diff / 3600000); return h <= 0 ? "刚刚" : h + " 小时前"; }
    if (day === 1) return "昨天";
    if (day < 30) return day + " 天前";
    var m = Math.floor(day / 30);
    if (m < 12) return m + " 个月前";
    return Math.floor(day / 365) + " 年前";
  }

  /* ---------- 筛选 ---------- */
  function buildFilters() {
    var box = el("filters");
    box.innerHTML = "";
    FILTERS.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "chip" + (f.key === filterKey ? " on" : "");
      b.textContent = f.label;
      b.onclick = function () {
        filterKey = f.key;
        idx = 0;
        applyFilter();
        render(true);
      };
      box.appendChild(b);
    });
  }
  function applyFilter() {
    list = filterKey === "all" ? EVENTS.slice() : EVENTS.filter(function (e) { return e.category === filterKey; });
    var chips = document.querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle("on", chips[i].textContent === (FILTERS.filter(function (f) { return f.key === filterKey; })[0] || {}).label);
    }
    buildThumbs();
    el("idxAll").textContent = list.length;
  }

  /* ---------- 缩略图 ---------- */
  function buildThumbs() {
    thumbsBox.innerHTML = "";
    list.forEach(function (e, i) {
      var d = document.createElement("div");
      d.className = "thumb" + (i === idx ? " on" : "");
      d.innerHTML = '<img src="' + e.image + '" alt="" loading="lazy" /><span>' + e.platform + '</span>';
      d.onclick = function (ev) { ev.stopPropagation(); go(i); };
      thumbsBox.appendChild(d);
    });
  }
  function syncThumbs() {
    var ts = thumbsBox.children;
    for (var i = 0; i < ts.length; i++) ts[i].classList.toggle("on", i === idx);
    var on = thumbsBox.children[idx];
    if (on && on.scrollIntoView) on.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }

  /* ---------- 渲染当前条 ---------- */
  function render(instant) {
    if (!list.length) return;
    var e = list[idx];

    img.classList.remove("kb");
    bg.classList.remove("kb");
    void img.offsetWidth;

    bg.src = e.image;
    img.src = e.image;
    img.alt = e.title;
    img.classList.add("kb");

    el("cPlatform").textContent = e.platform;
    el("cPlatform").className = "badge" + (e.region === "global" ? " g" : "");
    el("cCategory").textContent = CAT_LABEL[e.category] || "行业动态";
    el("cSource").textContent = "来源 · " + e.source;
    el("cDate").textContent = e.date.replace(/-/g, " / ");
    el("cTime").textContent = e.time || "";
    el("cWeek").textContent = weekday(e.date);
    el("cAgo").textContent = ago(e.date, e.time);
    el("cTitle").textContent = e.title;
    el("cSummary").textContent = e.summary;
    el("cTags").innerHTML = (e.tags || []).map(function (t) { return '<span class="tag">#' + t + "</span>"; }).join("");
    var link = el("cLink");
    link.href = e.url;
    link.onclick = function (ev) { ev.stopPropagation(); };

    el("idxNow").textContent = idx + 1;
    el("idxAll").textContent = list.length;
    syncThumbs();

    // 文字逐个浮出
    card.classList.remove("anim-in");
    void card.offsetWidth;
    card.classList.add("anim-in");

    // 预加载下一张
    var nx = list[(idx + 1) % list.length];
    if (nx) { var p = new Image(); p.src = nx.image; }

    restartProgress();
  }

  /* ---------- 播放控制 ---------- */
  function restartProgress() {
    prog.classList.remove("run");
    void prog.offsetWidth;
    prog.style.animationDuration = AUTOPLAY + "ms";
    if (playing) prog.classList.add("run");
    clearTimeout(timer);
    if (playing) timer = setTimeout(function () { go(idx + 1); }, AUTOPLAY);
  }
  function setPlaying(v) {
    playing = v;
    playIcon.innerHTML = v
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M8 5.5v13l11-6.5z"/>';
    restartProgress();
  }
  function go(i) {
    if (!list.length) return;
    idx = (i + list.length) % list.length;
    render();
  }

  /* ---------- 事件 ---------- */
  media.onclick = function () {
    var e = list[idx];
    if (e && e.url) window.open(e.url, "_blank", "noopener,noreferrer");
  };
  el("prevBtn").onclick = function (ev) { ev.stopPropagation(); go(idx - 1); };
  el("nextBtn").onclick = function (ev) { ev.stopPropagation(); go(idx + 1); };
  el("playBtn").onclick = function (ev) { ev.stopPropagation(); setPlaying(!playing); };
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft") go(idx - 1);
    else if (ev.key === "ArrowRight") go(idx + 1);
    else if (ev.key === " ") { ev.preventDefault(); setPlaying(!playing); }
  });
  // 触摸滑动
  var tx = 0;
  stage.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 48) go(idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
  // 鼠标悬停暂停
  stage.addEventListener("mouseenter", function () { if (playing) { clearTimeout(timer); prog.classList.remove("run"); } });
  stage.addEventListener("mouseleave", function () { if (playing) restartProgress(); });

  /* ---------- 今日热点速览 ---------- */
  function buildHotList() {
    var box = el("hotList");
    var sorted = EVENTS.slice().sort(function (a, b) {
      return (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""));
    }).slice(0, 8);
    box.innerHTML = "";
    sorted.forEach(function (e) {
      var li = document.createElement("li");
      li.className = "hot-item";
      li.innerHTML =
        '<span class="hot-dot"></span>' +
        '<span class="hot-time">' + e.date.slice(5).replace("-", "/") + " " + (e.time || "") + "</span>" +
        '<span class="hot-main"><span class="hot-title">' + e.title + "</span>" +
        '<span class="hot-meta"><span>' + e.platform + "</span><span>·</span><span>" + e.source + "</span>" +
        "<span>·</span><span>" + (CAT_LABEL[e.category] || "行业动态") + "</span></span></span>";
      li.onclick = function () {
        // 若当前筛选下没有该条，先切回全部
        var pos = list.map(function (x) { return x.id; }).indexOf(e.id);
        if (pos < 0) { filterKey = "all"; applyFilter(); pos = list.map(function (x) { return x.id; }).indexOf(e.id); }
        go(pos);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      box.appendChild(li);
    });
  }

  /* ---------- 大促倒计时 ---------- */
  function buildCountdowns() {
    var box = el("cdList");
    box.innerHTML = "";
    var now = new Date();
    CD.map(function (c) {
      var t = new Date(c.date + "T00:00:00");
      return { c: c, days: Math.ceil((t - now) / 86400000) };
    }).filter(function (x) { return x.days >= 0; }).sort(function (a, b) { return a.days - b.days; }).slice(0, 5).forEach(function (x) {
      var d = document.createElement("div");
      d.className = "cd";
      var pct = Math.max(4, Math.min(100, Math.round(100 - (x.days / 365) * 100)));
      d.innerHTML =
        '<div class="cd-days">' + x.days + "<small>DAYS</small></div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="cd-name">' + x.c.name + "</div>" +
        '<div class="cd-date">' + x.c.date + " · " + x.c.platform + "</div>" +
        '<div class="cd-bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>' +
        "</div>";
      box.appendChild(d);
    });
  }

  /* ---------- 启动 ---------- */
  buildFilters();
  applyFilter();
  render();
  buildHotList();
  buildCountdowns();
})();
</script>
</body>
</html>

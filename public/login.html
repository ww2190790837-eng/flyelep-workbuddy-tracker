<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#7ea9cc" />
<title>登录 Fleta</title>
<link rel="icon" href="/logo.svg" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#16CFFB;--primary-2:#7DE6FD;--pink:#3aa8e6;
    --text:#ffffff;--text-2:#d3e3fb;--text-3:#9fbce8;
    --surface:#0d4fbc;--border:rgba(255,255,255,.22);
    --gradient:linear-gradient(135deg,#16CFFB 0%,#77FEFC 52%,#7DE6FD 100%);
    --danger:#ff9a9a;--success:#5fd39a;--gold:#ffc54a;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  html,body{height:100%}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;
    min-height:100vh;overflow-x:hidden;position:relative;
    background:#04205e;
    display:flex;align-items:stretch;
  }
  ::selection{background:var(--primary);color:#fff}

  /* ===== 背景：静态渐变 + 缓慢漂移线稿(纯 SVG)，无 canvas 逐帧重绘 ===== */
  .bg-stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#04205e}
  .bg-base{position:absolute;inset:-12%;z-index:-1;background:
    radial-gradient(58% 46% at 22% 12%, rgba(22,207,251,.3), transparent 62%),
    radial-gradient(60% 50% at 80% 24%, rgba(1,95,204,.62), transparent 64%),
    radial-gradient(80% 66% at 52% 116%, rgba(3,31,100,.72), transparent 68%),
    linear-gradient(165deg, rgba(1,95,204,.5) 0%, rgba(3,42,120,.55) 44%, rgba(2,14,48,.8) 100%)}
  .bg-draw{position:absolute;inset:-12% -8%;opacity:.4;will-change:transform;animation:drawDrift 140s ease-in-out infinite}
  .bg-draw svg{width:100%;height:100%;display:block}
  @keyframes drawDrift{0%,100%{transform:translate3d(0,0,0) scale(1.02)}50%{transform:translate3d(-1.6%,-1.2%,0) scale(1.05) rotate(.5deg)}}
  .bg-grid{position:absolute;inset:0;opacity:.12;
    background-image:linear-gradient(to right,rgba(160,215,255,.12) 1px,transparent 1px),linear-gradient(to bottom,rgba(160,215,255,.12) 1px,transparent 1px);
    background-size:104px 104px;
    -webkit-mask-image:radial-gradient(ellipse 82% 72% at 50% 38%,#000 22%,transparent 82%);
    mask-image:radial-gradient(ellipse 82% 72% at 50% 38%,#000 22%,transparent 82%)}
  .bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse 92% 82% at 50% 44%,transparent 46%,rgba(2,14,48,.6) 100%)}
  /* WebGL 流光签名背景：全屏 canvas 作最底层主背景；.bg-base 退为兜底 */
  #bgfx{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
  .bg-page{position:absolute;inset:0;background:url("/assets/p3/web/art-page-bg.webp") center/cover no-repeat;opacity:.34;filter:saturate(1.06) contrast(1.05) brightness(.62)}
  @media (prefers-reduced-motion:reduce){.bg-draw{animation:none}}

  /* ===== 布局 ===== */
  .stage{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.05fr .95fr;min-height:100vh}
  @media (max-width:900px){ .stage{grid-template-columns:1fr} .brand-pane{display:none} }

  /* 左侧品牌区 */
  .brand-pane{padding:56px 56px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative}
  .brand-top{display:flex;align-items:center;gap:12px}
  .brand-logo{width:44px;height:44px;border-radius:12px;box-shadow:0 0 20px rgba(56,189,248,.45);background:#fff;padding:4px}
  .brand-name{font-weight:800;font-size:19px;letter-spacing:-.3px}
  .brand-mid{max-width:420px}
  .brand-mid h1{font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-1px;margin-bottom:18px}
  .brand-mid h1 .grad{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-mid p{color:rgba(255,255,255,.72);font-size:15px;margin-bottom:28px}
  .brand-points{display:flex;flex-direction:column;gap:14px}
  .brand-point{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.85);font-size:14px}
  .brand-point .ic{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);flex:none;margin:0 12px}
  .brand-foot{color:rgba(255,255,255,.5);font-size:12px}

  /* 右侧表单区 */
  .form-pane{display:flex;align-items:center;justify-content:center;padding:32px 24px;
    background:linear-gradient(180deg,rgba(4,26,74,.72),rgba(3,18,56,.86));
    border-left:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .card{width:100%;max-width:400px}
  .card-head{text-align:center;margin-bottom:26px}
  .card-logo{width:54px;height:54px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 0 20px rgba(56,189,248,.35)}
  .card-head h2{font-size:23px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px;color:#fff}
  .card-head p{font-size:13px;color:var(--text-3)}

  /* Tabs */
  .tabs{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:4px;margin-bottom:22px;position:relative}
  .tab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;position:relative;z-index:1;transition:color .25s;border:none;background:none;font-family:inherit}
  .tab.active{color:#fff}
  .tab-glider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:9px;
    background:linear-gradient(135deg,rgba(22,207,251,.5),rgba(1,95,204,.6));border:1px solid var(--primary);
    box-shadow:0 4px 14px rgba(0,8,32,.4);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .tab-glider.right{transform:translateX(100%)}

  /* 表单 */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;font-family:inherit;background:rgba(3,20,60,.6);transition:all .2s;color:var(--text)}
  .input::placeholder{color:rgba(255,255,255,.38)}
  .input:focus{outline:none;border-color:var(--primary);background:rgba(3,20,60,.8);box-shadow:0 0 0 4px rgba(22,207,251,.18)}
  .pw-wrap{position:relative}
  .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-3);font-size:13px;user-select:none}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px;font-size:13px}
  .remember{display:flex;align-items:center;gap:7px;color:var(--text-2);cursor:pointer;user-select:none}
  .remember input{width:15px;height:15px;accent-color:var(--primary)}
  .forgot{color:var(--primary);font-weight:600;text-decoration:none}
  .forgot:hover{text-decoration:underline}

  .submit{width:100%;padding:14px;border:none;border-radius:11px;background:var(--gradient);color:#04121f;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:-.1px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 28px rgba(22,207,251,.35)}
  .submit:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(124,164,200,.5)}
  .submit:disabled{opacity:.7;cursor:default;transform:none}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .terms{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:12px;color:var(--text-3);line-height:1.5}
  .terms input{margin-top:2px;accent-color:var(--primary);flex:none}
  .terms a{color:var(--primary);text-decoration:none}
  .terms a:hover{text-decoration:underline}

  .alert{display:none;align-items:center;gap:9px;padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:14px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .alert.show{display:flex;animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .card-foot{text-align:center;margin-top:22px;font-size:13px;color:var(--text-3)}
  .card-foot a{color:var(--primary);font-weight:600;text-decoration:none}
  .card-foot a:hover{text-decoration:underline}

  .back-home{position:absolute;top:22px;left:22px;z-index:2;color:rgba(255,255,255,.8);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
  .back-home:hover{color:#fff}
  @media (max-width:900px){ .back-home{color:var(--text-3)} }

  /* ===== P3 视觉语言（与主站同一套）===== */
  .brand-name,.brand-mid h1,.card-head h2,.brand-eyebrow{font-family:"Oswald","Inter",sans-serif}
  .brand-name{letter-spacing:.22em;text-transform:uppercase;font-weight:600;font-size:18px}
  .brand-mid h1{font-size:clamp(38px,4.4vw,58px);line-height:1.02;font-weight:700;letter-spacing:.01em;margin-bottom:16px}
  .brand-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.28em;
    color:var(--primary);text-transform:uppercase;margin-bottom:16px}
  .brand-eyebrow::before{content:"";width:0;height:0;flex:none;
    border-left:7px solid var(--primary);border-top:5px solid transparent;border-bottom:5px solid transparent}
  .brand-mid h1 .grad{background:linear-gradient(135deg,#16CFFB 0%,#77FEFC 52%,#7DE6FD 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .brand-point .ic{background:var(--primary);box-shadow:0 0 10px rgba(22,207,251,.7)}
  .card-head h2{letter-spacing:.02em;text-transform:none}

  /* 角色立绘融入左侧品牌区 */
  .brand-pane{overflow:hidden}
  .brand-fig{position:absolute;right:-4%;bottom:-2%;width:min(48%,400px);height:82%;z-index:0;pointer-events:none;
    background:url('/assets/p3/fig/character1.webp') center bottom/contain no-repeat;
    filter:drop-shadow(0 26px 46px rgba(0,8,32,.65))}
  .brand-top,.brand-mid,.brand-foot{position:relative;z-index:2}

  /* 背景层：半调网点 + 斜切光带 */
  .bg-halftone{position:absolute;inset:0;pointer-events:none;opacity:.13;
    background-image:radial-gradient(rgba(255,255,255,.6) 1.2px,transparent 1.6px);background-size:18px 18px}
  .bg-slant{position:absolute;inset:-30% -15%;pointer-events:none;opacity:.06;
    background:repeating-linear-gradient(118deg,rgba(255,255,255,.85) 0 1.5px,transparent 1.5px 54px)}

  /* P3 分层波浪（贴底，SVG 取自官网 #gentle-wave） */
  .wave-band{position:absolute;left:0;right:0;bottom:0;height:110px;overflow:hidden;line-height:0;
    pointer-events:none;z-index:1}
  .waves{position:relative;width:100%;height:100%}
  .parallax > use{animation:waveMove 20s cubic-bezier(.55,.5,.45,.5) infinite}
  .parallax > use:nth-child(1){animation-delay:-2s;animation-duration:12s}
  .parallax > use:nth-child(2){animation-delay:-3s;animation-duration:16s}
  .parallax > use:nth-child(3){animation-delay:-4s;animation-duration:20s}
  .parallax > use:nth-child(4){animation-delay:-5s;animation-duration:24s}
  @keyframes waveMove{0%{transform:translate3d(-90px,0,0)}100%{transform:translate3d(85px,0,0)}}

  /* 表单卡：P3 直角角标 */
  .card{position:relative}
  .card::before,.card::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;
    border:1px solid var(--primary);opacity:.85}
  .card::before{top:-14px;left:-14px;border-right:none;border-bottom:none}
  .card::after{bottom:-14px;right:-14px;border-left:none;border-top:none}

  @media (max-width:900px){ .brand-fig{display:none} .wave-band{height:74px} }
  @media (prefers-reduced-motion:reduce){ .parallax > use{animation:none} }
</style>
</head>
<body>
  <div class="bg-stage" aria-hidden="true">
    <canvas id="bgfx" aria-hidden="true"></canvas>
    <div class="bg-base"></div>
    <div class="bg-page"></div>
    <div class="bg-draw">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1" stroke-linecap="square">
        <circle cx="1180" cy="360" r="300"/>
        <circle cx="1180" cy="360" r="240" stroke-dasharray="2 7"/>
        <circle cx="1180" cy="360" r="182"/>
        <circle cx="1180" cy="360" r="98" stroke-dasharray="14 11"/>
        <circle cx="1180" cy="360" r="7"/>
        <path d="M1180 120V600M940 360H1420"/>
        <path d="M1084 150v46M1090 150v46M1096 150v46M1102 150v46M1108 150v46M1114 150v46M1120 150v46M1126 150v46M1132 150v46M1138 150v46M1144 150v46M1150 150v46"/>
        <path d="M0 792 640 250"/>
        <path d="M96 640A300 300 0 0 1 596 300" stroke-dasharray="3 8"/>
        <path d="M120 300h180v180H120z"/>
        <path d="M120 300l180 180M300 300 120 480"/>
        <circle cx="210" cy="390" r="26"/>
        <path d="M300 640h210M300 660h150M300 680h186M300 700h120"/>
        <path d="M360 250v-60M420 250v-40M480 250v-58M540 250v-34"/>
      </svg>
    </div>
    <div class="bg-halftone"></div>
    <div class="bg-slant"></div>
    <div class="bg-grid"></div>
    <div class="bg-vig"></div>
    <div class="wave-band" aria-hidden="true">
      <svg class="waves" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/></defs>
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="0" fill="rgba(1,95,204,.5)"/>
          <use href="#gentle-wave" x="48" y="3" fill="rgba(22,207,251,.34)"/>
          <use href="#gentle-wave" x="48" y="5" fill="rgba(3,31,100,.7)"/>
          <use href="#gentle-wave" x="48" y="7" fill="rgba(2,14,48,.9)"/>
        </g>
      </svg>
    </div>
  </div>
  <a class="back-home" href="/">← 返回首页</a>

  <div class="stage">
    <!-- 左侧品牌 -->
    <aside class="brand-pane">
      <div class="brand-top">
        <img class="brand-logo" src="/logo.svg" alt="Fleta" />
        <span class="brand-name">Fleta</span>
      </div>
      <div class="brand-fig" aria-hidden="true"></div>
      <div class="brand-mid">
        <span class="brand-eyebrow">Sign In / 登录</span>
        <h1>欢迎来到<br/><span class="grad">Fleta</span></h1>
        <p>AI 提示词生成 · 视频反推 · 电商视觉设计工具</p>
        <div class="brand-points">
          <div class="brand-point"><span class="ic">·</span> 一键生成专业级 AI 提示词</div>
          <div class="brand-point"><span class="ic">·</span> Seedance 2.5 / SD 2.5 视频反推</div>
          <div class="brand-point"><span class="ic">·</span> 注册即送 70 张图片生成积分</div>
          <div class="brand-point"><span class="ic">·</span> 数据安全，隐私保护</div>
        </div>
      </div>
      <div class="brand-foot">© 2026 Fleta</div>
    </aside>

    <!-- 右侧表单 -->
    <main class="form-pane">
      <div class="card">
        <div class="card-head">
          <img class="card-logo" src="/logo.svg" alt="Fleta" />
          <h2 id="title">欢迎回来</h2>
          <p id="subtitle">登录以继续使用 Fleta</p>
        </div>

        <div class="tabs">
          <button class="tab active" id="tabLogin" type="button">登录</button>
          <button class="tab" id="tabReg" type="button">注册</button>
          <span class="tab-glider" id="glider"></span>
        </div>

        <div class="alert" id="alert"><span style="font-weight:700">!</span><span id="alertMsg"></span></div>

        <form id="form" novalidate>
          <div class="field" id="nameField" style="display:none">
            <label>昵称(可选)</label>
            <input class="input" type="text" name="name" placeholder="给自己起个名字" autocomplete="name" />
          </div>
          <div class="field">
            <label>邮箱</label>
            <input class="input" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label>密码</label>
            <div class="pw-wrap">
              <input class="input" type="password" name="password" placeholder="至少 6 位" autocomplete="current-password" minlength="6" required />
              <span class="pw-toggle" id="pwToggle">显示</span>
            </div>
          </div>

          <div class="field" id="otpField" style="display:none">
            <label>邮箱验证码</label>
            <div style="display:flex;gap:10px">
              <input class="input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" style="flex:1;min-width:0;text-align:center;letter-spacing:3px" />
              <button type="button" id="sendCodeBtn" style="flex:0 0 auto;white-space:nowrap;padding:0 18px;background:rgba(158,196,228,.12);color:var(--primary,#9ec4e0);border:1px solid rgba(158,196,228,.4);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">获取验证码</button>
            </div>
            <p id="otpHint" style="display:none;margin-top:8px;font-size:12px;color:var(--text-3);line-height:1.6"></p>
          </div>

          <div class="row" id="loginRow">
            <label class="remember"><input type="checkbox" name="remember" checked /> 记住我</label>
            <a class="forgot" href="#" id="forgot">忘记密码?</a>
          </div>

          <button class="submit" type="submit" id="submit">
            <span id="submitText">登录</span>
          </button>

          <label class="terms" id="terms" style="display:none">
            <input type="checkbox" name="agree" required />
            <span>我已阅读并同意 <a href="/terms.html" target="_blank" rel="noopener">服务条款</a> 与 <a href="/privacy.html" target="_blank" rel="noopener">隐私政策</a></span>
          </label>
        </form>

        <div class="card-foot" id="foot">
          还没有账户? <a href="#" id="switch">立即注册</a>
        </div>
      </div>
    </main>
  </div>

<script>
(function(){
  var mode = "login";
  var form = document.getElementById("form");
  var alertBox = document.getElementById("alert");
  var alertMsg = document.getElementById("alertMsg");
  var submit = document.getElementById("submit");
  var submitText = document.getElementById("submitText");
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");
  var nameField = document.getElementById("nameField");
  var loginRow = document.getElementById("loginRow");
  var terms = document.getElementById("terms");
  var foot = document.getElementById("foot");
  var glider = document.getElementById("glider");
  var tabLogin = document.getElementById("tabLogin");
  var tabReg = document.getElementById("tabReg");
  var pwToggle = document.getElementById("pwToggle");

  function showAlert(msg){
    alertMsg.textContent = msg;
    alertBox.classList.add("show");
  }
  function clearAlert(){ alertBox.classList.remove("show"); }

  function setMode(m){
    mode = m;
    clearAlert();
    if (m === "register"){
      title.textContent = "创建账户";
      subtitle.textContent = "注册即送 70 张图片积分";
      nameField.style.display = "block";
      document.getElementById("otpField").style.display = "block";
      document.getElementById("otpHint").style.display = "none";
      loginRow.style.display = "none";
      terms.style.display = "flex";
      submitText.textContent = "注册并登录";
      foot.innerHTML = '已有账户? <a href="#" id="switch">立即登录</a>';
      glider.classList.add("right");
      tabLogin.classList.remove("active"); tabReg.classList.add("active");
      form.querySelector("input[name=password]").setAttribute("autocomplete","new-password");
    } else {
      title.textContent = "欢迎回来";
      subtitle.textContent = "登录以继续使用 Fleta";
      nameField.style.display = "none";
      document.getElementById("otpField").style.display = "none";
      document.getElementById("otpHint").style.display = "none";
      loginRow.style.display = "flex";
      terms.style.display = "none";
      submitText.textContent = "登录";
      foot.innerHTML = '还没有账户? <a href="#" id="switch">立即注册</a>';
      glider.classList.remove("right");
      tabReg.classList.remove("active"); tabLogin.classList.add("active");
      form.querySelector("input[name=password]").setAttribute("autocomplete","current-password");
    }
    bindSwitch();
    form.querySelector("input[name=email]").focus();
  }

  function bindSwitch(){
    var sw = document.getElementById("switch");
    if (sw) sw.addEventListener("click", function(e){ e.preventDefault(); setMode(mode==="login"?"register":"login"); });
  }
  tabLogin.addEventListener("click", function(){ setMode("login"); });
  tabReg.addEventListener("click", function(){ setMode("register"); });

  pwToggle.addEventListener("click", function(){
    var inp = form.querySelector("input[name=password]");
    if (inp.type === "password"){ inp.type="text"; pwToggle.textContent="隐藏"; }
    else { inp.type="password"; pwToggle.textContent="显示"; }
  });

  document.getElementById("forgot").addEventListener("click", function(e){
    e.preventDefault();
    showAlert("请联系客服微信(见首页底部)重置密码,密码找回功能即将上线。");
  });

  // 是否已登录 → 直接回首页
  fetch("/api/auth/me", {credentials:"include"})
    .then(function(r){return r.json();})
    .then(function(d){ if(d.user) location.href="/"; })
    .catch(function(){});

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    clearAlert();
    var fd = new FormData(form);
    var email = (fd.get("email")||"").trim();
    var password = fd.get("password")||"";
    var name = (fd.get("name")||"").trim();

    if (!/^[^\s@]+@([^\s@.]+\.)+[^\s@.]+$/.test(email)){ showAlert("请输入有效的邮箱地址"); return; }
    if (password.length < 6){ showAlert("密码至少 6 位"); return; }
    if (mode === "register" && !fd.get("agree")){ showAlert("请先同意服务条款与隐私政策"); return; }
    if (mode === "register") {
      var codeVal = (fd.get("code")||"").trim();
      if (!codeVal){ showAlert("请先获取并填写邮箱验证码"); return; }
    }

    submit.disabled = true;
    submit.innerHTML = '<span class="spinner"></span><span>处理中...</span>';

    var endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
    var payload = { email: email, password: password };
    if (mode === "register" && name) payload.name = name;
    if (mode === "register") payload.code = (fd.get("code")||"").trim();

    try {
      var resp = await fetch(endpoint, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body: JSON.stringify(payload)
      });
      var data = await resp.json();
      if (!resp.ok || !data.ok){
        showAlert(data.error || "操作失败,请重试");
        submit.disabled = false;
        submit.innerHTML = '<span id="submitText">'+submitText.textContent+'</span>';
        return;
      }
      location.href = "/";
    } catch(err){
      showAlert("网络异常,请稍后重试");
      submit.disabled = false;
      submit.innerHTML = '<span id="submitText">'+submitText.textContent+'</span>';
    }
  });

  bindSwitch();

  // ===== 邮箱验证码:获取 + 60s 冷却 =====
  var sendCodeBtn = document.getElementById("sendCodeBtn");
  var otpHint = document.getElementById("otpHint");
  var sendCodeTimer = null;
  function startSendCooldown(sec){
    var left = sec;
    sendCodeBtn.disabled = true;
    sendCodeBtn.textContent = left + " 秒后重试";
    if (sendCodeTimer) clearInterval(sendCodeTimer);
    sendCodeTimer = setInterval(function(){
      left--;
      if (left <= 0){ clearInterval(sendCodeTimer); sendCodeBtn.disabled = false; sendCodeBtn.textContent = "重新获取"; }
      else { sendCodeBtn.textContent = left + " 秒后重试"; }
    }, 1000);
  }
  function sendCode(){
    var emailVal = (form.querySelector("input[name=email]").value || "").trim();
    if (!/^[^\s@]+@([^\s@.]+\.)+[^\s@.]+$/.test(emailVal)){
      showAlert("请先填写正确的邮箱再获取验证码");
      return;
    }
    clearAlert();
    otpHint.style.display = "none";
    sendCodeBtn.disabled = true;
    sendCodeBtn.textContent = "发送中...";
    fetch("/api/auth/send-code", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: emailVal}), credentials:"include"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok){
          showAlert(d.error || "验证码发送失败");
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = "获取验证码";
          return;
        }
        otpHint.style.display = "block";
        if (d.dev && d.devCode){
          otpHint.innerHTML = "开发模式(未配置真实邮件):验证码已生成 → <b style=\"color:#f59e0b;letter-spacing:2px\">" + d.devCode + "</b><br>配置 SMTP/Resend 后将直接发送到邮箱";
        } else {
          otpHint.textContent = d.message || "验证码已发送,请查收邮箱(10 分钟内有效)";
        }
        startSendCooldown(60);
      })
      .catch(function(){
        showAlert("网络异常,请稍后重试");
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = "获取验证码";
      });
  }
  if (sendCodeBtn) sendCodeBtn.addEventListener("click", sendCode);
})();
</script>
<script src="/bgfx.js"></script>
</body>
</html>

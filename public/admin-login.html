<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5b3bff" />
<title>管理员登录 · Fleta 后台</title>
<link rel="icon" href="/logo.svg" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#5b3bff;--primary-2:#7c5cff;--pink:#ff5b9b;--wb:#1e88e5;--gradient:linear-gradient(135deg,#5b3bff 0%,#7c5cff 50%,#ff5b9b 100%);--danger:#ef4444}
  html,body{height:100%}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#0a0a25;display:flex;align-items:center;justify-content:center;min-height:100vh;background:
    radial-gradient(120% 120% at 80% -10%, #2a1b6b 0%, transparent 55%),
    radial-gradient(120% 120% at 0% 100%, #3a1b5e 0%, transparent 50%), #0b0820;
    position:relative;overflow:hidden}
  body::before,body::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;mix-blend-mode:screen}
  body::before{width:480px;height:480px;background:radial-gradient(circle,#7c5cff,transparent 70%);top:-120px;left:-80px}
  body::after{width:420px;height:420px;background:radial-gradient(circle,#ff5b9b,transparent 70%);bottom:-120px;right:-60px}
  .wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:24px}
  .card{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:22px;padding:40px 36px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
  .badge{width:56px;height:56px;border-radius:16px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(91,59,255,.4)}
  h1{text-align:center;font-size:21px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
  .sub{text-align:center;font-size:13px;color:#8a8aa8;margin-bottom:26px}
  .field label{display:block;font-size:12px;color:#4a4a6a;margin-bottom:6px;font-weight:500}
  .input{width:100%;padding:13px 14px;border:1.5px solid rgba(15,15,40,.1);border-radius:11px;font-size:14px;font-family:inherit;background:#fafafe;transition:all .2s}
  .input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(91,59,255,.1)}
  .err{display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .err.show{display:flex}
  .submit{width:100%;padding:14px;border:none;border-radius:11px;background:var(--gradient);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 8px 24px rgba(91,59,255,.4)}
  .submit:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(91,59,255,.5)}
  .submit:disabled{opacity:.7;cursor:default}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{text-align:center;margin-top:20px;font-size:12px;color:#8a8aa8}
  .foot a{color:var(--primary);text-decoration:none;font-weight:600}
  .back{display:block;text-align:center;margin-top:16px;font-size:12px;color:rgba(255,255,255,.6);text-decoration:none}
  .back:hover{color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">🔐</div>
      <h1>管理员通道</h1>
      <div class="sub">Fleta × WorkBuddy 数据后台</div>
      <div class="err" id="err"><span>⚠️</span><span id="errMsg"></span></div>
      <form id="form">
        <div class="field">
          <label>管理员密码 (Token)</label>
          <input class="input" type="password" id="token" placeholder="请输入后台访问密码" autocomplete="current-password" autofocus />
        </div>
        <button class="submit" type="submit" id="submit">进入后台</button>
      </form>
      <div class="foot">忘记密码?联系 <a href="/">站点管理员</a></div>
    </div>
    <a class="back" href="/">← 返回落地页</a>
  </div>
<script>
(function(){
  var form=document.getElementById("form"),err=document.getElementById("err"),errMsg=document.getElementById("errMsg"),submit=document.getElementById("submit"),token=document.getElementById("token");
  function showErr(m){errMsg.textContent=m;err.classList.add("show");}
  // 若 URL 已带 token,自动尝试进入
  var p=new URLSearchParams(location.search);
  if(p.get("token")){ location.href="/admin?token="+encodeURIComponent(p.get("token")); return; }
  form.addEventListener("submit",function(e){
    e.preventDefault();err.classList.remove("show");
    var v=token.value.trim();
    if(!v){showErr("请输入管理员密码");return;}
    submit.disabled=true;submit.innerHTML='<span class="spinner"></span> 验证中...';
    location.href="/admin?token="+encodeURIComponent(v);
  });
  // 密码错误回退(e=1)时提示
  if(new URLSearchParams(location.search).get("e")==="1"){ showErr("密码不正确,请重试"); }
})();
</script>
</body>
</html>

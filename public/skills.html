<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080b14" />
<title>电商智能体技能库 · Nexscope 127 个电商研究智能体</title>
<meta name="description" content="Nexscope 电商智能体技能库：127 个 API 驱动的电商研究智能体，覆盖 Amazon、TikTok Shop、1688、专利、沃尔玛、Ozon 等 23 个平台。" />
<meta property="og:title" content="电商智能体技能库 · Nexscope" />
<meta property="og:description" content="127 个 API 驱动的电商研究智能体，覆盖 Amazon / TikTok / 1688 / 专利 / 沃尔玛 等 23 个平台" />
<meta property="og:type" content="website" />
<link rel="icon" href="/logo.svg" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080b14;--surface:#111524;
    --text:#eef1f8;--text-2:#aab0c4;--text-3:#7c8299;
    --primary:#7c5cff;--primary-2:#9b7cff;--pink:#ff5b9b;--cyan:#00d4ff;--amber:#ffb020;
    --gradient:linear-gradient(135deg,#7c5cff 0%,#9b7cff 45%,#ff5b9b 100%);
    --card-bg:rgba(13,16,30,.62);
    --border:rgba(255,255,255,.12);
  }
  html{background:var(--bg);scroll-behavior:smooth}
  body{
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(124,92,255,.20), transparent 60%),
      radial-gradient(800px 520px at 92% 4%, rgba(255,91,155,.16), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ===== top nav ===== */
  .top-nav{position:fixed;top:0;left:0;right:0;z-index:60;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);background:rgba(8,11,20,.55);border-bottom:1px solid rgba(255,255,255,.07)}
  .nav-inner{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
  .nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.2px}
  .nav-logo img{width:32px;height:32px;border-radius:9px;box-shadow:0 4px 16px rgba(124,92,255,.4)}
  .nav-sub{font-size:12px;color:var(--text-3);font-weight:500;letter-spacing:.4px}
  .nav-spacer{flex:1}
  .nav-back{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid rgba(124,92,255,.35);background:rgba(124,92,255,.10);color:var(--primary-2);transition:.25s;white-space:nowrap}
  .nav-back:hover{background:rgba(124,92,255,.2);transform:translateY(-1px)}

  /* ===== hero ===== */
  .wrap{max-width:1440px;margin:0 auto;padding:0 24px}
  .hero{padding:120px 0 28px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-2);background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.28);padding:6px 14px;border-radius:999px;margin-bottom:18px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 12px var(--primary)}
  h1.title{font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:-1.2px;line-height:1.05;background:linear-gradient(180deg,#fff,#c9c2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitle{margin-top:14px;max-width:720px;color:var(--text-2);font-size:16px}
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px 20px;min-width:120px}
  .stat .n{font-size:26px;font-weight:900;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .stat .l{font-size:12px;color:var(--text-3);margin-top:6px;letter-spacing:.3px}

  /* ===== controls ===== */
  .controls{position:sticky;top:62px;z-index:40;padding:16px 0;background:linear-gradient(180deg,rgba(8,11,20,.92),rgba(8,11,20,.7));backdrop-filter:blur(8px);margin-top:24px}
  .search{position:relative;max-width:640px}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3)}
  .search input{width:100%;padding:14px 16px 14px 46px;border-radius:14px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:15px;outline:none;transition:.2s}
  .search input::placeholder{color:var(--text-3)}
  .search input:focus{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 4px rgba(124,92,255,.15)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
  .chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2);background:rgba(255,255,255,.05);border:1px solid var(--border);transition:.2s;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.28)}
  .chip.active{color:#fff;background:var(--gradient);border-color:transparent;box-shadow:0 6px 18px rgba(124,92,255,.35)}
  .chip .c{opacity:.7;margin-left:6px;font-weight:500}
  .result-count{margin-top:14px;font-size:13px;color:var(--text-3)}

  /* ===== grid ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;padding:10px 0 80px}
  .card{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:20px;transition:.25s;display:flex;flex-direction:column;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(135deg,rgba(124,92,255,.5),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s;pointer-events:none}
  .card:hover{transform:translateY(-4px);border-color:transparent;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .card:hover::before{opacity:1}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.4px;padding:5px 11px;border-radius:999px;white-space:nowrap;color:#0b0e18}
  .ver{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-3);border:1px solid var(--border);padding:3px 8px;border-radius:999px;white-space:nowrap}
  .card h3{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.35;color:#fff;word-break:break-word}
  .desc{margin-top:8px;color:var(--text-2);font-size:14px;flex:1}
  .triggers{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  .trig{font-size:12.5px;color:var(--text-3);display:flex;gap:8px;align-items:flex-start;line-height:1.45}
  .trig::before{content:"▸";color:var(--primary-2);flex-shrink:0}
  .files{margin-top:14px;padding-top:13px;border-top:1px dashed rgba(255,255,255,.10);font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .files .fcount{font-weight:700;color:var(--text-2)}
  .files .ftoggle{color:var(--primary-2);cursor:pointer;font-weight:600}
  .filelist{display:none;margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--text-3);background:rgba(0,0,0,.25);border-radius:10px;padding:10px 12px;line-height:1.7;word-break:break-all}
  .filelist.open{display:block}
  .empty{grid-column:1/-1;text-align:center;color:var(--text-3);padding:60px 0;font-size:15px}

  footer{border-top:1px solid rgba(255,255,255,.07);padding:28px 0;color:var(--text-3);font-size:13px;text-align:center}
  footer a{color:var(--primary-2)}
  @media (max-width:600px){.hero{padding:100px 0 20px}.wrap{padding:0 16px}.controls{top:58px}}
</style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <img src="/logo.svg" alt="Fleta" onerror="this.style.display='none'" />
        <span>电商智能体技能库</span>
      </a>
      <span class="nav-sub">Nexscope · 127 个 API 智能体</span>
      <span class="nav-spacer"></span>
      <a class="nav-back" href="/">← 返回首页</a>
    </div>
  </nav>

  <header class="hero wrap">
    <span class="eyebrow"><span class="dot"></span>API-DRIVEN AGENT SKILLS</span>
    <h1 class="title">Nexscope 电商智能体技能库</h1>
    <p class="subtitle">127 个由 API 驱动的电商研究智能体，覆盖 Amazon、TikTok Shop、1688、专利检索、沃尔玛、Ozon 等 23 个平台与工具。点击任意技能查看能力说明与触发场景。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="wrap">
    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜索技能名称、能力说明或触发场景…（如 Amazon 广告、专利、1688）" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
      <div class="result-count" id="rc"></div>
    </div>

    <main class="grid" id="grid"></main>
  </div>

  <footer class="wrap">
    由 <a href="/">Fleta × WorkBuddy</a> 提供 · 技能数据来自 Nexscope Ecommerce Skills 技能包（127 个智能体）
  </footer>

  <script src="skills-data.js"></script>
  <script>
    (function () {
      const SKILLS = window.NEXSCOPE_SKILLS || [];
      const META = window.NEXSCOPE_META || { total: SKILLS.length, categories: [] };
      const PALETTE = {
        amazon: "#ff9900", tiktok: "#ff4d6d", patent: "#5b8def", ozon: "#cb1b3a",
        walmart: "#1976d2", "1688": "#ff6a00", etsy: "#f1641e", google: "#34a853",
        ruiguan: "#00b8d9", temu: "#ff5000", mercado: "#ffe600", multimodal: "#a855f7",
        shopee: "#ee4d2d", shopify: "#95bf47", product: "#26c6da", zhihuiya: "#7e57c2",
        ebay: "#e53238", geo: "#43a047", maidalv: "#00897b", reverse: "#ec407a",
        text: "#8d6e63", utility: "#78909c", web: "#42a5f5", misc: "#90a4ae"
      };
      const colorFor = (c) => PALETTE[c] || "#90a4ae";

      const $ = (s) => document.querySelector(s);
      const grid = $("#grid"), chipsEl = $("#chips"), rc = $("#rc"), qEl = $("#q");

      // stats
      $("#stats").innerHTML = [
        { n: META.total, l: "智能体技能" },
        { n: META.categories.length, l: "覆盖平台 / 工具" },
        { n: META.categories[0] ? META.categories[0].count : 0, l: "最大类目 (" + (META.categories[0] ? META.categories[0].label : "—") + ")" },
        { n: "API", l: "驱动方式" }
      ].map((s) => `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join("");

      // chips
      const allChip = { key: "__all", label: "全部", count: SKILLS.length };
      const chipData = [allChip, ...META.categories];
      let activeCat = "__all";
      chipsEl.innerHTML = chipData.map((c) =>
        `<button class="chip${c.key === activeCat ? " active" : ""}" data-cat="${c.key}">${c.label}<span class="c">${c.count}</span></button>`
      ).join("");
      chipsEl.addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        activeCat = b.dataset.cat;
        chipsEl.querySelectorAll(".chip").forEach((x) => x.classList.toggle("active", x.dataset.cat === activeCat));
        render();
      });

      qEl.addEventListener("input", render);

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
      }

      function render() {
        const q = qEl.value.trim().toLowerCase();
        const list = SKILLS.filter((s) => {
          if (activeCat !== "__all" && s.category !== activeCat) return false;
          if (!q) return true;
          const hay = (s.name + " " + s.description + " " + s.categoryLabel + " " + (s.triggers || []).join(" ")).toLowerCase();
          return hay.includes(q);
        });
        rc.textContent = `显示 ${list.length} / ${SKILLS.length} 个技能` + (q ? `（搜索：“${qEl.value.trim()}”）` : "");
        if (!list.length) {
          grid.innerHTML = `<div class="empty">没有匹配的技能，试试别的关键词或切换类目。</div>`;
          return;
        }
        grid.innerHTML = list.map((s) => {
          const col = colorFor(s.category);
          const triggers = (s.triggers || []).slice(0, 3).map((t) => `<div class="trig">${esc(t)}</div>`).join("");
          const moreTrig = (s.triggers || []).length > 3 ? `<div class="trig" style="color:var(--text-3)">+${s.triggers.length - 3} 个更多触发场景</div>` : "";
          const files = (s.files || []).map((f) => esc(f)).join("\n");
          return `
          <article class="card">
            <div class="card-head">
              <span class="tag" style="background:${col}">${esc(s.categoryLabel)}</span>
              ${s.version ? `<span class="ver">v${esc(s.version)}</span>` : ""}
            </div>
            <h3>${esc(s.name)}</h3>
            <p class="desc">${esc(s.description)}</p>
            ${triggers || moreTrig ? `<div class="triggers">${triggers}${moreTrig}</div>` : ""}
            <div class="files">
              <span class="fcount">${s.fileCount} 个文件</span>
              ${s.fileCount ? `<span class="ftoggle" data-id="${esc(s.id)}">查看清单</span>` : ""}
            </div>
            ${s.fileCount ? `<div class="filelist" id="fl-${esc(s.id)}">${files}</div>` : ""}
          </article>`;
        }).join("");
        grid.querySelectorAll(".ftoggle").forEach((t) => {
          t.addEventListener("click", () => {
            const fl = document.getElementById("fl-" + t.dataset.id);
            if (fl) fl.classList.toggle("open");
          });
        });
      }

      render();
    })();
  </script>
</body>
</html>

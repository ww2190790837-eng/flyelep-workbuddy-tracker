<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fleta · 前沿 AI 视频创作工具</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background video -->
  <div class="bg" aria-hidden="true">
    <video class="bg-video" autoplay muted loop playsinline>
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="page">
    <!-- 1) Header (desktop) -->
    <header class="header">
      <div class="header-inner">
        <a class="logo anim" href="#" style="--d:.05s" aria-label="Fleta 首页">
          <img src="assets/logo.webp" alt="" width="52" height="52" />
        </a>

        <nav class="nav-pill anim" style="--d:.12s" aria-label="主导航">
          <a href="#" class="nav-link active">首页</a>
          <a href="#" class="nav-link">产品</a>
          <a href="#" class="nav-link">案例</a>
          <a href="#" class="nav-link">联系</a>
        </nav>

        <a class="sign-in anim" href="#" style="--d:.18s">登录</a>

        <button class="burger" id="burger" aria-label="打开菜单" aria-expanded="false" aria-controls="mobileMenu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- 2) Hero (center) -->
    <main class="hero">
      <div class="hero-inner">
        <div class="trust anim" style="--d:.05s">
          <div class="avatar a1"><span class="avatar-inner"><i class="fa-solid fa-film"></i></span></div>
          <div class="avatar a2"><span class="avatar-inner"><i class="fa-solid fa-video"></i></span></div>
          <div class="avatar a3"><span class="avatar-inner"><i class="fa-solid fa-clapperboard"></i></span></div>
          <div class="trust-pill">已服务 2000+ 创作者与内容团队</div>
        </div>

        <h1 class="headline">
          <span class="line">Fleta</span>
          <span class="line">前沿 AI 视频创作</span>
        </h1>

        <p class="subhead anim" style="--d:.28s">
          用 AI 生成视频提示词、反向解析原片、一键生成视频——
          让好创意被更多人看见。
        </p>

        <a class="cta anim" style="--d:.4s" href="#">免费开始创作</a>
      </div>
    </main>

    <!-- 3) Stats footer -->
    <footer class="stats">
      <div class="stat anim" style="--d:.5s">
        <span class="stat-icon">#</span>
        <span class="stat-value" data-target="2.4" data-suffix="M" data-decimals="1">0</span>
        <span class="stat-label">已生成视频</span>
      </div>
      <div class="stat anim" style="--d:.58s">
        <span class="stat-icon">%</span>
        <span class="stat-value" data-target="99.9" data-suffix="%" data-decimals="1">0</span>
        <span class="stat-label">创作成功率</span>
      </div>
      <div class="stat anim" style="--d:.66s">
        <span class="stat-icon">*</span>
        <span class="stat-value" data-target="24" data-suffix="/7" data-decimals="0">0</span>
        <span class="stat-label">全天候服务</span>
      </div>
      <div class="stat anim" style="--d:.74s">
        <span class="stat-icon">&lt;</span>
        <span class="stat-value" data-target="120" data-suffix="s" data-decimals="0">0</span>
        <span class="stat-label">平均出片</span>
      </div>
    </footer>
  </div>

  <!-- Mobile sheet menu -->
  <div class="overlay" id="overlay" hidden></div>
  <nav class="mobile-menu" id="mobileMenu" hidden aria-label="移动端菜单">
    <a href="#" class="m-link active">首页</a>
    <a href="#" class="m-link">产品</a>
    <a href="#" class="m-link">案例</a>
    <a href="#" class="m-link">联系</a>
    <a href="#" class="m-signin">登录</a>
  </nav>

  <script src="main.js"></script>
</body>
</html>

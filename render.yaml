services:
  - type: web
    name: fleta-ai
    slug: fleta-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://fleta-ai.onrender.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: b55b38001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: ww2190790837@gmail.com
    healthCheckPath: /healthz

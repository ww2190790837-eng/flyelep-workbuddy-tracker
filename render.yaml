services:
  - type: web
    name: flyelep-wb-tracker
    slug: flyelep-wb-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    maxRequestTimeout: 300
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://fleta.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: b55b38001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: ww2190790837@gmail.com
      - key: AI_PROVIDER
        value: qwen
      - key: AI_MODEL
        value: qwen-flash
      - key: AI_VISION_MODEL
        value: qwen-vl-max
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      # ---- Agnes 视频（仅这一个功能用）----
      # 密钥只在 Render 面板维护（代码里没有兜底值）；换 key 只需改这一项并重新部署
      - key: AGNES_API_KEY
        sync: false          # 密钥只放面板（本仓库公开，绝不能写进代码）
      - key: AGNES_BASE_URL
        value: https://api.agnes-ai.cn/v1     # 国内站（国际站是 apihub.agnes-ai.com，两站 key 不通用）
      - key: AGNES_RETRIEVE_URL
        value: https://api.agnes-ai.cn/agnesapi
      - key: AGNES_VIDEO_MODEL
        value: agnes-video-2.5-flash
    healthCheckPath: /healthz

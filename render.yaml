services:
  - type: web
    name: flyelep-wb-tracker
    slug: flyelep-wb-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    maxRequestTimeout: 300
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://flyelep-wb-tracker.onrender.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: b55b38001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: ww2190790837@gmail.com
      - key: AI_PROVIDER
        value: qwen
      - key: AI_MODEL
        value: qwen-flash
      - key: AI_VISION_MODEL
        value: qwen-vl-max
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      # ---- Agnes 视频（仅这一个功能用）----
      # 密钥：留空即用 server.mjs 里的兜底值；换新 key 只需在 Render 面板改这一项，无需改代码
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_VIDEO_MODEL
        value: agnes-3.0-flash
    healthCheckPath: /healthz

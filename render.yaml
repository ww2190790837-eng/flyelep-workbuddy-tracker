services:
  - type: web
    name: flyelep-wb-tracker
    runtime: node
    rootDir: app
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://flyelep-wb-tracker.onrender.com
    healthCheckPath: /healthz
